# Copy to config.yaml and edit. config.yaml and work/ are git-ignored: personal data never enters the repo.

sample_id: SAMPLE            # ASCII, no spaces; written into every VCF and plink file
name_zh: 样本                # display name in the Chinese report
name_en: Sample              # display name in the English report
sex: male                    # male | female (drives X ploidy and the sex-consistency check)

# --- input. Give reads (CRAM or BAM, coordinate-sorted and indexed). FASTQ needs setup/01_align.sh first.
reads: work/data/raw/SAMPLE.cram
# fastq1: work/data/raw/SAMPLE_R1.fastq.gz
# fastq2: work/data/raw/SAMPLE_R2.fastq.gz
vendor_vcf: ""               # optional: a VCF delivered alongside the reads. Empty = call from the reads.
y_reads: ""                  # optional: a separate Y-only BAM if the provider supplied one

work_dir: work
ref_dir: work/data/ref
tools_dir: work/tools
threads: 8
mem_gb: 30
build: GRCh37                # the only build the pipeline supports

# --- callable mask. Everything outside it is reported as "no call", never as reference.
callable_min_depth: 8
callable_min_mapq: 20

# --- reference populations (1000 Genomes labels). Defaults suit an East Asian sample; change for others.
ref_superpop: EAS            # percentiles are "among the N individuals of this super-population"
ref_subpops: [CHB, CHS]      # second percentile column
axis_pops: [CHS, CHB]        # per-chromosome axis index: 0 = first, 1 = second
local_ancestry_a: [CHB, JPT]      # local-ancestry source panel A
local_ancestry_b: [CDX, KHV]      # local-ancestry source panel B
local_ancestry_control: [CEU, GBR, GIH, PJL]   # unrelated panels, included only to measure the noise floor
local_ancestry_labels: [NorthEA, SouthEA]
# ancient-DNA panel (optional). Leave empty to skip the AADR steps.
aadr_modern: [Han, Japanese, Korean, She, Miao, Tujia, Dai, Yi, Naxi, Tu, Xibo, Oroqen, Hezhen, Daur,
              Mongola, Tibetan, Kinh_Vietnamese, Thai, Cambodian, Ami, Atayal, Zhuang, Dong, Ulchi, CHB, CHS, CDX]
aadr_ancient_prefix: [China_, Mongolia_, Taiwan_, Vietnam_, Japan_, Korea_, Russia_DevilsCave, Laos_, Thailand_]
# aadr_annotation: work/data/ref/aadr/v66.p1_HO.aadr.patch.PUB.anno   # default: <aadr_prefix>.anno

# --- ancestry quality gates (§7.3). Recorded in each analysis manifest; changing one invalidates
# previously built results rather than silently reusing them. Empty/absent key = previous behaviour.
ancestry_min_call_rate_modern: 0.95     # present-day AADR reference individuals
ancestry_min_call_rate_target: 0.95     # the target sample, on the final pruned reference sites
aadr_min_call_rate_ancient: 0.50        # ancient individuals: one set for maps, PCA and rankings
ancestry_min_projection_snps: 10000     # working gate, not a validated accuracy claim
ancestry_min_group_n: 2                 # groups smaller than this stay out of default rankings

# --- local-ancestry holdout calibration (§7.3). Empty pops = use the source panels above.
# Why these four chromosomes: they span the size range of the autosomes -- chr1 (249 Mb), chr2 (243 Mb),
# chr6 (171 Mb, carries the MHC), chr22 (51 Mb) -- together 24.8% of the autosome length. Marker counts
# and length-weighted fractions disagree most on the short chromosomes, so a set with this spread makes
# the two conventions comparable at a fraction of the cost of all 22 (each one reruns FLARE). This is a
# working gate that can be changed, not a claim that passing it validates accuracy; if a run covers only
# some of these chromosomes it is recorded as partial, and calibration.tsv then mixes holdout generations.
local_ancestry_calibration_pops: []
local_ancestry_calibration_chroms: [1, 2, 6, 22]
local_ancestry_calibration_n: 20
local_ancestry_calibration_seed: 1

# --- optional local evidence file for paternal/maternal haplogroup history (versioned JSON).
lineage_history_file: ""
# analysis_id: ""      # free-form label recorded in every manifest; empty = derived from inputs
